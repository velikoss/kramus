group 'com.vitalex.ramus'
version '1.0-SNAPSHOT'

apply plugin: 'java'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':gui-framework-common')
    implementation project(':gui-framework-core')
    implementation project(':idef0-core')
    implementation project(':report-common')
    implementation 'org.freehep:freehep-graphicsio-emf:2.4'
    implementation 'batik:batik-svggen:1.6-1'
    implementation 'javax.help:javahelp:2.0.05'
    implementation project(':common')
    implementation project(':core')
    implementation project(':report-core')
    implementation project(':gui-qualifier')
    implementation project(':core-simple-attributes')
    implementation project(':database-storage')
    implementation project(':data-framework-common')
    implementation files('../gui-qualifier/libs/my-spell-core.jar')
    implementation files('../gui-qualifier/libs/my-spell-swing.jar')
    implementation 'net.htmlparser.jericho:jericho-html:3.3'
    implementation 'org.swinglabs.swingx:swingx-all:1.6.5-1'
    implementation 'tablelayout:TableLayout:20050920'
    implementation 'com.h2database:h2:1.3.163'
    testImplementation group: 'junit', name: 'junit', version: '4.11'
}

if(JavaVersion.current() >= JavaVersion.VERSION_11) {
    dependencies {
        implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.0'
        implementation 'com.sun.xml.bind:jaxb-core:2.3.0'
        implementation 'com.sun.xml.bind:jaxb-impl:2.3.0'
    }
}

task dfdTextImport(type: JavaExec) {
    group = 'application'
    description = 'Adds a DFD diagram to an existing .rms file from a text DSL. ' +
            'Usage: ./gradlew :idef0-common:dfdTextImport -PmodelFile=model.rms -PdslFile=diagram.txt'
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'com.ramussoft.idef0.textimport.DfdTextImportMain'
    if (project.hasProperty('modelFile') && project.hasProperty('dslFile')) {
        args project.property('modelFile'), project.property('dslFile')
    }
}

task idlImport(type: JavaExec) {
    group = 'application'
    description = 'Imports an .idl file into a .rms model headlessly (same path as the ' +
            'IDEF0 -> "Импортировать из IDL" menu action). ' +
            'Usage: ./gradlew :idef0-common:idlImport -PmodelFile=out.rms -PidlFile=in.idl'
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'com.ramussoft.idef0.textimport.IdlImportMain'
    if (project.hasProperty('modelFile') && project.hasProperty('idlFile')) {
        args project.property('modelFile'), project.property('idlFile')
    }
}

task dfdPngPreview(type: JavaExec) {
    group = 'application'
    description = 'Renders a DFD DSL file straight to PNG, no .rms involved. ' +
            'Usage: ./gradlew :idef0-common:dfdPngPreview -PdslFile=diagram.txt -PpngFile=out.png'
    classpath sourceSets.main.runtimeClasspath
    mainClass = 'com.ramussoft.idef0.textimport.DfdPreviewMain'
    if (project.hasProperty('dslFile') && project.hasProperty('pngFile')) {
        args project.property('dslFile'), project.property('pngFile')
    }
}
